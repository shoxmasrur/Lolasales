name: CI

# Har bir push va PR da: tiplar va birlik testlari.
# Bazasiz ishlaydi — testlar sof funksiyalarni tekshiradi.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  tekshiruv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tiplar (server, web)
        run: npm run typecheck

      - name: Birlik testlari
        run: |
          npm run test:column-map --workspace=server
          npm run test:lead-columns --workspace=server
          npm run test:import-leads --workspace=server
          npm run test:mijoz-yaratuvchi --workspace=server
          npm run test:reklama-oqimi --workspace=server
          npm run test:lead-boshlash --workspace=server
          npm run test:bulk-oldindan --workspace=server
          npm run test:kampaniya-sharti --workspace=server
          npm run test:izoh-filtri --workspace=server
          npm run test:izoh-muallifi --workspace=server
          npm run test:izoh-yiguvchi --workspace=server
          npm run test:name-match --workspace=server
          npm run test:gender --workspace=server
          # Loyiha ildizi bundle'da ham to'g'ri (`server/dist` → `/opt` emas).
          npm run test:project-root --workspace=server
          npm run test:telegram-quota --workspace=server
          npm run test:spam-parser --workspace=server
          npm run test:telegram-errors --workspace=server
          npm run test:peer-selection --workspace=server
          # Agent promptidagi taqiqlangan so'zlar (qarz, qachonroq, -da, ajoyib).
          npm run test:lugat --workspace=server
          # Standart sotuv qoidalari: qarz so'zlari yo'q, brief bo'limlari, e'tirozlar, mijoz turlari.
          npm run test:sotuv-qoidalari --workspace=server
          npm run test:kun-chegarasi --workspace=server
          npm run test:norozilik --workspace=server
          npm run test:bot-tokeni --workspace=server
          npm run test:mavzudan-tashqari --workspace=server
          npm run test:llm-narxi --workspace=server
          # Sof funksiya — `shared/config` ni tortmaydi, `.env` shart emas.
          npm run test:llm-tamgasi --workspace=server
          # `mapClient` o'qiydigan har ustun `COLS` da bor. Statik.
          npm run test:client-cols --workspace=server
          npm run test:xarid-sharti --workspace=server
          npm run test:xarid-xizmati --workspace=server
          npm run test:mijoz-tartibi --workspace=server
          npm run test:contact-name --workspace=server

      # Bular `AgentRunner` yoki `shared/datetime` orqali `shared/config` ni
      # tortadi, u esa ishga tushishda `.env` ni tekshiradi. CI'da `.env`
      # yo'q, shuning uchun soxta qiymatlar beriladi: testlar na bazaga, na
      # Telegramga, na modelga chiqadi — qiymatlar faqat sxema tekshiruvidan
      # o'tish uchun.
      - name: Agent navbati testlari
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          JWT_SECRET: ci-uchun-soxta-kalit-16+
          ENCRYPTION_KEY: ci-uchun-soxta-kalit-16+
        run: |
          # Mijozga XABAR YUBORADIGAN yo'lning darvozasi — ro'yxatda
          # bo'lmasa, qulf yo'q.
          npm run test:eskirgan-javob --workspace=server
          npm run test:uzilgan-navbat --workspace=server
          # Jim qolgan mijozga eslatma. Bu testlar mijozga XABAR
          # YUBORADIGAN yo'lni qo'riqlaydi — ro'yxatda bo'lmasa, qulf yo'q.
          npm run test:eslatma --workspace=server
          npm run test:eslatma-kuzatuvchi --workspace=server
          # Operator topshirig'i — mijozga XABAR YUBORADIGAN yo'l.
          npm run test:agent-topshirigi --workspace=server
          npm run test:operator-vazifasi --workspace=server
          # Chek operator tasdig'i. Rasm tasnifchisi obuna tokeni bilan.
          npm run test:chek-tasnif-auth --workspace=server
          npm run test:rasm-tasnifi --workspace=server
          # PDF chek tasnifi (2026-09-24) — tasnifchi `document` blokini yuboradi.
          npm run test:pdf-tasnifi --workspace=server
          npm run test:chek-mapper --workspace=server
          npm run test:chek-ochilishi --workspace=server
          npm run test:rasm-oqimi --workspace=server
          npm run test:pdf-oqimi --workspace=server
          npm run test:chek-tasdiq-vazifasi --workspace=server
          npm run test:chek-javobi --workspace=server
          npm run test:chek-sukut --workspace=server
          npm run test:chek-tasdiqi --workspace=server
          npm run test:chek-tasdiq-route --workspace=server
          npm run test:chek-poygasi --workspace=server
          npm run test:uslub-versiyasi --workspace=server
          npm run test:prompt-composer --workspace=server
          npm run test:uslub-tamgasi --workspace=server
          npm run test:uslub-marshruti --workspace=server
          npm run test:client-list-query --workspace=server
          npm run test:api-kalit --workspace=server
          npm run test:ruxsat-guruhlari --workspace=server
          npm run test:course --workspace=server
          npm run test:purchase --workspace=server
          npm run test:app-log-cleaner --workspace=server
          npm run test:bulk-job-store --workspace=server
          npm run test:bulk-job-resumer --workspace=server
          npm run test:bulk-lookup-resume --workspace=server
          npm run test:bulk-lookup-stop --workspace=server
          npm run test:bulk-start-resume --workspace=server
          npm run test:stt-xonzoda --workspace=server
          npm run test:stt-taqqoslash --workspace=server
          npm run test:start-takror-himoyasi --workspace=server
          # `llmKaliti.ts` → `shared/crypto` → `shared/config` zanjiri: bu
          # ham soxta env kerak bo'lgan guruhga tegishli, «Birlik testlari»
          # bosqichida emas.
          npm run test:llm-kaliti --workspace=server
          # `OpenAiAgentEngine` → `prompt/systemPrompt` va `agentOutput`
          # zanjiri orqali `shared/config` ni tortadi (`.env` shart emas,
          # lekin modul yuklanishda tekshiradi) — shuning uchun shu yerda,
          # «Birlik testlari»da emas. `fetch` spec ichida stub qilinadi,
          # tarmoqqa chiqilmaydi.
          npm run test:openai-engine --workspace=server
          # `AgentEngineFactory` `ClaudeAgentEngine` orqali `shared/config`
          # ni tortadi — shu sabab shu yerda, «Birlik testlari»da emas.
          # Har qanday shubhali holatda (model yo'q, o'chirilgan, kalit
          # yo'q) standart dvigatelga qaytishini tekshiradi — mijoz
          # javobsiz qolmasligi shu testga bog'liq.
          npm run test:engine-factory --workspace=server
          # `AgentRunner` orqali `shared/config` ni tortadi — standart
          # dvigatelga qaytish (`navbat()`) va uning to'rt shartini
          # (fallback, AbortedError, Claude xatosi) tekshiradi.
          npm run test:llm-qaytish --workspace=server
          npm run test:qoriqchi-navbat --workspace=server
          # `llmRoutes.ts` `OpenAiAgentEngine`ni import qiladi (probe
          # marshruti uchun), u esa `prompt/systemPrompt` va `agentOutput`
          # zanjiri orqali `shared/config`ni tortadi — shu sabab shu yerda,
          # «Birlik testlari»da emas. Kalitning javobga, audit yozuviga
          # yoki xato matniga sizib chiqmasligini tekshiradi.
          npm run test:llm-marshruti --workspace=server
          # Suhbatlar ro'yxati `clientId` filtri: UUID repoga, aks holda 422.
          npm run test:conversation-list-route --workspace=server
          # Fayl yetkazilgach yiqilgan hisob yozuvi xabarni "failed" qilmaydi.
          npm run test:dispatcher-fayl --workspace=server
          # Kiruvchi oqim: faqat shaxsiy chat va haqiqiy foydalanuvchi.
          npm run test:kiruvchi-filtr --workspace=server
          # To'lov kartasi xabari: tanlash, summa, tayyorlik, matn.
          npm run test:karta --workspace=server
          # Guruh havolasi: qoida (birinchi_qism/toliq), bir marta, matn.
          npm run test:havola --workspace=server
          # Sotuv konteksti va javob sxemasi `systemPrompt` orqali `shared/config` ni tortadi.
          npm run test:sales-context --workspace=server
          npm run test:agent-output-sales --workspace=server
          # Shaxs, kompaniya nomi, {ism} va tizim prompti bo'limlari tartibi.
          npm run test:persona-name --workspace=server
          npm run test:tuzatilgan-belgisi --workspace=server
          # `AgentRunner.apply()` sotuv qadamlari: kurs, bosqich, karta (takror himoyasi, xato → menejer).
          npm run test:agent-sotuv-navbati --workspace=server
          # Karta raqami va yopiq havola: tarixda belgi, model javobida — yuborilmaydi.
          npm run test:maxfiy-qiymat --workspace=server
          # Ketayotgan navbatni uzish va bloklagan mijozga eslatma yozmaslik.
          npm run test:agent-abort --workspace=server
          npm run test:blocked-reminder --workspace=server
          # Ommaviy suhbat boshlash: o'tkazib yuborilganlar ismi bilan, parallel oqimlar.
          npm run test:bulk-skip-details --workspace=server
          npm run test:bulk-parallel --workspace=server
          # Mijozlar Excel eksporti ustunlari (qarz ustunlarisiz).
          npm run test:eksport-jadvali --workspace=server
          npm run test:mijoz-qatori --workspace=server
          # Kunlik sotuv xulosasi matni (bot orqali).
          npm run test:kunlik-xulosa --workspace=server
          # Sotuv voronkasi (ulush hisobi, tartib).
          npm run test:voronka --workspace=server
          npm run test:log-context --workspace=server
          npm run test:log-entry --workspace=server

      - name: Build
        run: npm run build
