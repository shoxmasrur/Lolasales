<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Debitor Agent — to'lov undirish paneli</title>
    <script>
      /*
       * Mavzu React ko'tarilishidan OLDIN qo'yiladi.
       *
       * Aks holda sahifa avval sukutdagi (qorong'i) rangda chizilib, keyin
       * yorug'ga sakrardi — har ochilishda ko'zni uradigan chaqnash.
       * Shu sabab bu kichik skript inline turadi va bloklaydi.
       */
      (function () {
        try {
          var v = localStorage.getItem('debitor.theme');
          var choice = v === 'light' || v === 'dark' ? v : 'system';
          var dark =
            choice === 'dark' ||
            (choice === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
